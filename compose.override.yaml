services:
  app:
    image: track-picture-service-dev:latest
    build:
      context: .
      target: development
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    environment:
      HOME: ${DEV_HOME:?Set DEV_HOME in .env}
      MAVEN_CONFIG: ${MAVEN_CONFIG:?Set MAVEN_CONFIG in .env}
      MAVEN_USER_HOME: ${MAVEN_USER_HOME:?Set MAVEN_USER_HOME in .env}
      MAVEN_OPTS: ${MAVEN_OPTS:?Set MAVEN_OPTS in .env}
      SPRING_DEVTOOLS_RESTART_ENABLED: ${SPRING_DEVTOOLS_RESTART_ENABLED:?Set SPRING_DEVTOOLS_RESTART_ENABLED in .env}
    volumes:
      - .:/workspace
      - maven-cache:/home/developer/.m2
    develop:
      watch:
        - path: ./src
          action: sync+exec
          target: /workspace/src
          exec:
            command: ./mvnw -q compile
        - path: ./pom.xml
          action: sync+restart
          target: /workspace/pom.xml

volumes:
  maven-cache:
