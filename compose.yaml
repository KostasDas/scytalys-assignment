name: track-picture

services:
  app:
    image: track-picture-service:latest
    build:
      context: .
      target: production
    environment:
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
      TRACK_UPDATES_TOPIC: ${TRACK_UPDATES_TOPIC:?Set TRACK_UPDATES_TOPIC in .env}
      TRACK_UPDATES_DLT_TOPIC: ${TRACK_UPDATES_DLT_TOPIC:?Set TRACK_UPDATES_DLT_TOPIC in .env}
    ports:
      - "${APP_PORT:?Set APP_PORT in .env}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:?Set KAFKA_NODE_ID in .env}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:?Set KAFKA_PROCESS_ROLES in .env}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:?Set KAFKA_LISTENER_SECURITY_PROTOCOL_MAP in .env}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:?Set KAFKA_LISTENERS in .env}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:?Set KAFKA_ADVERTISED_LISTENERS in .env}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:?Set KAFKA_CONTROLLER_LISTENER_NAMES in .env}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:?Set KAFKA_CONTROLLER_QUORUM_VOTERS in .env}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:?Set KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR in .env}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:?Set KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR in .env}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:?Set KAFKA_TRANSACTION_STATE_LOG_MIN_ISR in .env}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:?Set KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS in .env}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} \
          --create --if-not-exists --topic ${TRACK_UPDATES_TOPIC} \
          --partitions ${TRACK_UPDATES_PARTITIONS} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} \
          --create --if-not-exists --topic ${TRACK_UPDATES_DLT_TOPIC} \
          --partitions 1 --replication-factor 1

volumes:
  kafka-data:
  postgres-data:
